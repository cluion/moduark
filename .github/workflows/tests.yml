name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Laravel 12 lowest
            major: 12
            php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            dependencies: lowest
          - name: Laravel 12 highest
            major: 12
            php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            dependencies: highest
          - name: Laravel 13 lowest
            major: 13
            php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            dependencies: lowest
          - name: Laravel 13 highest
            major: 13
            php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            dependencies: highest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select framework constraints
        run: >-
          composer require --dev
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          --no-update --no-interaction --no-scripts

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: >-
          composer update --prefer-lowest --prefer-dist
          --no-interaction --no-progress

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: >-
          composer update --prefer-dist
          --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run verification
        run: composer verify

      - name: Run clean Laravel installation
        if: matrix.dependencies == 'highest'
        run: composer test:installation -- --laravel=${{ matrix.major }}
